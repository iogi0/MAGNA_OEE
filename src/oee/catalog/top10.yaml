# Predvolené aktívne kódy pre operátora: Top-10 ST + „Other" a Top-10 Q + „Other" (TASK §5.4, PLANNING D9).
# Výber mení manažér v Settings z celého číselníka (codes.yaml); toto je iba predvolený stav pre seed.
# Kategória tu má prednosť pred kategóriou číselníka (ST-001 → Material shortage, ST-017 → Tool).

# Kategórie: id → zobrazovaný názov (rovnaký ako v golden hodnotách TASK §12, napr. „Camera malfunction").
categories:
  camera: Camera malfunction
  leak_test: Leak test issue
  material_shortage: Material shortage
  tool: Tool issue
  robot: Robot issue
  pressing: Pressing issue
  screwdriving: Screwdriving issue
  general: General
  other: Other

# Poradie = poradie v TASK §5.4.
stop:
  - {code: ST-038, category: camera}        # dataset
  - {code: ST-016, category: camera}        # dataset
  - {code: ST-046, category: leak_test}     # dataset
  - {code: ST-047, category: leak_test}     # dataset
  - {code: ST-001, category: material_shortage}  # dataset
  - {code: ST-017, category: tool}          # dataset
  - {code: ST-020, category: robot}         # typický pre stanice 1, 10
  - {code: ST-026, category: pressing}      # typický pre stanice 2, 7
  - {code: ST-032, category: screwdriving}  # typický pre stanice 4, 5, 8
  - {code: ST-040, category: camera}        # typický pre stanicu 3
other_stop: ST-048

defect:
  - {code: Q-031, category: leak_test}      # dataset
  - {code: Q-020, category: pressing}       # dataset
  - {code: Q-026, category: screwdriving}   # dataset
  - {code: Q-030, category: camera}         # dataset
  - {code: Q-021, category: pressing}
  - {code: Q-022, category: pressing}
  - {code: Q-025, category: screwdriving}
  - {code: Q-027, category: screwdriving}
  - {code: Q-032, category: leak_test}
  - {code: Q-003, category: general}
other_defect: Q-034
