{# Riadok rozpisu zmätkov — celý číselník Q + Other (D15). #}
<div class="row-card defect-row">
  <div class="grid">
    <label>Defect type
      <select name="defect_code" required>
        <option value="">— choose —</option>
        {% for c in defects %}
        <option value="{{ c.code }}"{% if row.defect_code == c.code %} selected{% endif %}>{{ c.code }} · {{ c.name_en }}</option>
        {% endfor %}
        <option value="{{ other_defect }}"{% if row.defect_code == other_defect %} selected{% endif %}>{{ other_defect }} · Other (comment required)</option>
      </select></label>
    <label>Quantity (pcs)
      <input name="defect_qty" type="number" min="1" step="1" value="{{ row.defect_qty or '' }}" required></label>
    <label>Comment
      <input name="defect_comment" value="{{ row.defect_comment or '' }}" maxlength="500"></label>
  </div>
  <button type="button" class="secondary outline small" onclick="this.closest('.row-card').remove()">Remove</button>
</div>
