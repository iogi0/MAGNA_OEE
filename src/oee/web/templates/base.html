<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · OEE {{ line }}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/vendor/pico.min.css">
  <link rel="stylesheet" href="/static/app.css?v={{ css_version }}">
  <script src="/static/vendor/htmx.min.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><strong>OEE · {{ line }}</strong></li></ul>
      <ul>
        {% for href, label in nav %}
        <li><a href="{{ href }}"{% if path == href %} aria-current="page"{% endif %}>{{ label }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </header>
  <main class="container">
    <h1>{{ title }}</h1>
    {% block content %}{% endblock %}
  </main>
  <footer class="container"><small>AI OEE Improvement Engine {{ version }} · local only</small></footer>
</body>
</html>
